role: thread_coordinator
label: Thread Coordinator
purpose: Partition large source inventories, coordinate bounded research batches, verify coverage, and compile evidence-backed synthesis.
runner:
  default: codex_cli
  approval_required: false
  max_retries: 2
  timeout_minutes: 60
  bash_access: true
threading:
  mode: task_scoped
permissions:
  read:
  - sources
  - research_plan
  - skills
  - artifacts/thread_runs
  write:
  - artifacts/thread_runs
  - topics
  - research_plan
  deny: []
secrets:
  allow: []
skills:
  allow_use: true
  root: skills
tools:
  allow:
  - read_repo
  - write_repo
  - web_research
  - run_krail_doctor
  deny: []
prompts:
  system: agents/prompts/thread_coordinator.md
  checklist: agents/checklists/thread_coordinator.md
completion:
  requires:
  - coverage_verified
  - synthesis_documented
